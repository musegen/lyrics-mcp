[project]
name = "lyrics-mcp"
version = "0.1.0"
description = "An MCP server that writes original song lyrics with Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "claude", "anthropic", "lyrics", "songwriting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=2.0.0",
    "anthropic>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
lyrics-mcp = "lyrics_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyrics_mcp"]
